<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070807">
  <meta name="robots" content="noindex,nofollow">
  <title>Sin conexión | Digital Forge</title>
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#070807;color:#f5f2ed}body{display:grid;place-items:center;padding:28px;font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% 25%,#25332b 0,transparent 34%),repeating-radial-gradient(circle at 0 100%,transparent 0 52px,#151715 53px 54px),#070807}.card{width:min(100%,520px);padding:34px;border:1px solid #2b2d2b;border-radius:28px;background:rgba(17,18,17,.94);box-shadow:0 30px 90px rgba(0,0,0,.35)}img{width:76px;height:76px;object-fit:contain}.eyebrow{display:block;margin-top:28px;color:#838883;font:700 10px ui-monospace,monospace;letter-spacing:.15em}h1{font-size:clamp(3rem,12vw,5.4rem);line-height:.84;letter-spacing:-.07em;margin:18px 0}p{color:#9ca19c;font-size:14px;line-height:1.7;margin:0 0 24px}.actions{display:flex;flex-wrap:wrap;gap:9px}button,a{appearance:none;border:0;border-radius:999px;padding:14px 18px;background:#f5f2ed;color:#111;text-decoration:none;font:800 12px Inter,system-ui,sans-serif;cursor:pointer}a{border:1px solid #3b3d3b;background:#171817;color:#fff}@media(max-width:520px){.card{padding:26px}.actions{display:grid}}
  </style>
</head>
<body>
  <main class="card">
    <img src="/logo-header.png" alt="Digital Forge">
    <span class="eyebrow">PORTAL DEL CLIENTE / OFFLINE</span>
    <h1>Sin<br>conexión.</h1>
    <p>Necesitamos internet para actualizar el progreso y mostrar tus archivos privados. Cuando vuelva la conexión, podrás continuar exactamente donde estabas.</p>
    <div class="actions"><button type="button" onclick="location.reload()">Intentar de nuevo →</button><a href="/portal/">Volver al portal</a></div>
  </main>
</body>
</html>
